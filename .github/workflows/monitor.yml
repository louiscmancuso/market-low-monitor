name: Restore initial repository files
on: workflow_dispatch
permissions:
  contents: write
jobs:
  restore:
    if: github.repository == 'louiscmancuso/market-low-monitor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore the initial tree except this workflow
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 7f4bc23dced86a94a2aabd449357643c03644fbd
          initial=5ff9e33df0a6d067778dcea69a21061c48580987
          workflow=.github/workflows/monitor.yml
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$workflow"
          git restore --source "$initial" --staged --worktree -- . ":(exclude)$workflow"
          git diff --cached --exit-code "$initial" -- . ":(exclude)$workflow"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore repository files to initial state'
          git push origin HEAD:main
